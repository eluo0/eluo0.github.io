<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eslucent — Taste & Fit Intelligence</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F0EB;
      --text: #1A1A1A;
      --accent: #C4542A;
      --accent-dark: #A8401F;
      --accent-light: #F2DDD4;
      --secondary: #8B7355;
      --card: #FFFFFF;
      --border: rgba(139,115,85,0.18);
      --muted: #B5A898;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: #E4DDD6;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Desktop: simulate browser context */
    @media (min-width: 900px) {
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 0;
        background: #2C2825;
      }
      .browser-chrome {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .browser-bar {
        background: #3A3330;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .browser-dots { display: flex; gap: 6px; }
      .browser-dot {
        width: 12px; height: 12px; border-radius: 50%;
      }
      .browser-dot:nth-child(1) { background: #FF5F57; }
      .browser-dot:nth-child(2) { background: #FFBD2E; }
      .browser-dot:nth-child(3) { background: #28C840; }
      .browser-url {
        flex: 1;
        background: #4A4440;
        border-radius: 6px;
        padding: 5px 14px;
        font-size: 12px;
        color: #B0A898;
        font-family: 'Inter', sans-serif;
        max-width: 520px;
        margin: 0 auto;
      }
      .browser-body {
        display: flex;
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .fake-page {
        flex: 1;
        background: #F8F5F2;
        overflow: hidden;
        position: relative;
        filter: blur(1px);
        opacity: 0.7;
      }
    }
    @media (max-width: 899px) {
      .browser-chrome { display: contents; }
      .browser-bar, .fake-page { display: none; }
      .store-page { min-height: 100vh; }
      .onboarding-backdrop { position: fixed !important; }
    }

    /* Fake background page content */
    .fake-page-inner {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .fake-product {
      background: #fff;
      border-radius: 4px;
      aspect-ratio: 3/4;
    }
    .fake-header {
      background: #fff;
      height: 52px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
    }
    .fake-header-logo { width: 80px; height: 16px; background: #1A1A1A; border-radius: 2px; }
    .fake-header-nav { display: flex; gap: 16px; }
    .fake-nav-item { width: 48px; height: 10px; background: #ccc; border-radius: 2px; }

    /* Extension wrapper */
    .extension-wrapper {
      width: 420px;
      min-width: 420px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
      overflow-x: hidden;
      position: relative;
      box-shadow: -4px 0 40px rgba(0,0,0,0.25);
      flex-shrink: 0;
    }

    @media (max-width: 899px) {
      .extension-wrapper {
        width: 100%;
        min-width: 0;
        box-shadow: none;
        height: 100vh;
        overflow-y: scroll;
      }
    }

    /* Screens */
    .screen {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      animation: fadeSlide 0.35s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ---- SHARED HEADER ---- */
    .ext-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 13px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .ext-logo {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .ext-logo span { color: var(--accent); }
    .ext-header-actions { display: flex; gap: 8px; align-items: center; }

    /* ---- BUTTONS ---- */
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      display: block;
      width: 100%;
      text-align: center;
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(196,84,42,0.28);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: transparent;
      color: var(--secondary);
      border: 1px solid var(--border);
      padding: 10px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 7px 10px;
      cursor: pointer;
      color: var(--secondary);
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- PROGRESS BAR ---- */
    .progress-track {
      height: 2px;
      background: var(--border);
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      border-radius: 1px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 8px;
      font-size: 11px;
      color: var(--secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ---- WELCOME SCREEN ---- */
    .welcome-screen {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .welcome-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 32px 24px;
      text-align: center;
    }
    .welcome-eyebrow {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 20px;
    }
    .welcome-headline {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .welcome-headline em {
      font-style: italic;
      color: var(--accent);
    }
    .welcome-subline {
      font-size: 14px;
      color: var(--secondary);
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 280px;
    }
    .welcome-cta-wrap { width: 100%; max-width: 320px; }
    .welcome-skip {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .welcome-skip:hover { color: var(--secondary); }
    .welcome-features {
      padding: 20px 20px 32px;
      display: flex;
      gap: 12px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .feature-chip {
      flex: 1;
      background: var(--card);
      border-radius: 6px;
      padding: 14px 10px;
      text-align: center;
    }
    .feature-chip-icon { font-size: 20px; margin-bottom: 6px; }
    .feature-chip-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--secondary);
      line-height: 1.3;
      letter-spacing: 0.03em;
    }
    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }

    /* ---- SCAN SCREEN ---- */
    /* Ensure last content never clips at the bottom */
    .scan-screen,
    .quiz-screen,
    .profile-screen,
    .products-screen,
    .dashboard-screen,
    .welcome-screen { padding-bottom: 80px; }

    .scan-screen { background: #000; padding-bottom: 0; }
    .camera-wrap {
      position: relative;
      width: 100%;
      height: 380px;
      background: #111;
      overflow: hidden;
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .camera-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, rgba(255,255,255,0.8) 50%, var(--accent) 70%, transparent 100%);
      box-shadow: 0 0 12px rgba(196,84,42,0.6);
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%   { top: 5%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 95%; opacity: 0; }
    }
    .corner-bracket {
      position: absolute;
      width: 24px; height: 24px;
    }
    .corner-bracket.tl { top: 12px; left: 12px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner-bracket.tr { top: 12px; right: 12px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .corner-bracket.bl { bottom: 12px; left: 12px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner-bracket.br { bottom: 12px; right: 12px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .scan-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .scan-info-panel {
      background: var(--bg);
      padding: 20px;
      flex: 1;
    }
    .scan-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .scan-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .scan-status-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .scan-measurements {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .scan-meas-item {
      background: var(--card);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      transition: all 0.4s;
    }
    .scan-meas-item.active {
      border: 1px solid var(--accent);
      background: var(--accent-light);
    }
    .scan-meas-value {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 28px;
    }
    .scan-meas-label {
      font-size: 10px;
      color: var(--secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .scan-meas-loading {
      width: 40px; height: 16px;
      background: linear-gradient(90deg, #e8e0d8 25%, #f5f0eb 50%, #e8e0d8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 3px;
      margin: 0 auto;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    .no-camera-placeholder {
      width: 100%; height: 380px;
      background: #1a1814;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #888;
    }
    .no-camera-icon { font-size: 40px; }
    .no-camera-text { font-size: 14px; color: #666; }

    /* ---- QUIZ SCREEN ---- */
    .quiz-screen { background: var(--bg); }
    .quiz-body { padding: 24px 20px; flex: 1; }
    .quiz-q-number {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .quiz-q-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .quiz-q-subtitle {
      font-size: 13px;
      color: var(--secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-options.grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .quiz-option {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .quiz-option:hover { border-color: var(--accent); }
    .quiz-option.selected {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .quiz-option.selected::after {
      content: '✓';
      position: absolute;
      top: 8px; right: 10px;
      width: 18px; height: 18px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 18px;
      text-align: center;
    }
    .quiz-option-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3px;
    }
    .quiz-option-desc {
      font-size: 12px;
      color: var(--secondary);
      line-height: 1.4;
    }
    .quiz-option-icon { font-size: 22px; margin-bottom: 8px; }
    .color-swatches {
      display: flex;
      gap: 4px;
      margin-top: 10px;
    }
    .color-swatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.5);
    }
    .silhouette-wrap {
      height: 56px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-top: 8px;
    }
    .texture-preview {
      height: 36px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .mood-image {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .quiz-footer {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* ---- PROFILE CARD ---- */
    .profile-screen { background: var(--bg); }
    .profile-hero {
      background: var(--text);
      color: #fff;
      padding: 28px 20px 24px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 200px; height: 200px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.12;
    }
    .profile-hero::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -20px;
      width: 160px; height: 160px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.08;
    }
    .profile-eyebrow {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .profile-name-label {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .profile-archetype-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 2px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .profile-body { padding: 20px; }
    .profile-section-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--secondary);
      font-weight: 500;
      margin-bottom: 12px;
    }
    .profile-measurements {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .profile-meas-card {
      background: var(--card);
      border-radius: 8px;
      padding: 12px 10px;
      text-align: center;
    }
    .profile-meas-val {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }
    .profile-meas-unit {
      font-size: 11px;
      color: var(--secondary);
    }
    .profile-meas-name {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .profile-taste-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .profile-taste-card {
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
    }
    .profile-taste-key {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary);
      margin-bottom: 5px;
    }
    .profile-taste-val {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-family: 'Playfair Display', serif;
    }
    .profile-season-card {
      background: var(--accent);
      border-radius: 8px;
      padding: 16px;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .profile-season-icon { font-size: 28px; }
    .profile-season-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; margin-bottom: 3px; }
    .profile-season-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 28px; }
    .profile-save-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ---- PRODUCT GRID ---- */
    .products-screen { background: var(--bg); }
    .products-filter-bar {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    .products-filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border);
      color: var(--secondary);
      background: var(--card);
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
    .product-card {
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .product-image-wrap {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: #f0ebe4;
    }
    .product-image-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    /* ========================================================

    function deriveColorSeason(colorAffinity, materialPref) {
      const map = {
        warm_soft: "Warm Spring",
        warm_structured: "Warm Autumn",
        warm_lightweight: "Warm Summer",
        warm_textured: "Warm Autumn",
        cool_soft: "Cool Summer",
        cool_structured: "Cool Winter",
        cool_lightweight: "Cool Summer",
        cool_textured: "Cool Winter",
        neutral_soft: "Soft Summer",
        neutral_structured: "True Winter",
        neutral_lightweight: "Soft Summer",
        neutral_textured: "Deep Autumn",
        bold_soft: "Clear Spring",
        bold_structured: "Deep Winter",
        bold_lightweight: "Clear Spring",
        bold_textured: "Deep Autumn",
      };
      return map[`${colorAffinity}_${materialPref}`] || "True Season";
    }

    function colorSeasonIcon(season) {
      if (season.includes("Spring")) return "🌸";
      if (season.includes("Summer")) return "☀️";
      if (season.includes("Autumn")) return "🍂";
      if (season.includes("Winter")) return "❄️";
      return "✦";
    }

    function computeMatchScore(product, profile) {
      if (!profile || !profile.tasteProfile) return Math.floor(Math.random() * 20) + 60;
      let score = 62;
      const archetype = profile.tasteProfile.archetype || "";
      const color = profile.tasteProfile.colorAffinity || "";
      const fit = profile.tasteProfile.fitPreference || "";
      const mat = profile.tasteProfile.material || "";

      if (product.archs.includes(archetype)) score += 18;
      else if (product.archs.some(a => ["minimalist","classic"].includes(a)) && ["minimalist","classic"].includes(archetype)) score += 8;

      if (product.col === color) score += 9;
      else if (product.col === "neutral") score += 4;

      if (product.fit === fit) score += 8;
      if (product.mat === mat) score += 6;

      // small variation
      const seed = product.id * 7 % 5;
      score += seed - 2;

      return Math.min(99, Math.max(55, score));
    }

    function recommendSize(measurements, sizes) {
      if (!measurements || sizes.length <= 1) return sizes[0];
      const waist = measurements.waist;
      const sizeMap = { XS: 62, S: 68, M: 74, L: 80, XL: 88, XXL: 96 };
      let best = sizes[0];
      let bestDiff = Infinity;
      sizes.forEach(s => {
        const target = sizeMap[s];
        if (target !== undefined) {
          const diff = Math.abs(waist - target);
          if (diff < bestDiff) { bestDiff = diff; best = s; }
        }
      });
      return best;
    }

    function generateFitProfile() {
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    /* ========================================================
       COLOR SEASON DATA & SCIENCE
    ======================================================== */
    const SEASON_PALETTES = {
      'Light Spring':  { best:['#F9C4A0','#F7E4C0','#B8D4A8','#A8C8D8','#F4B8C8','#FFD4A0'], avoid:['#1A1A1A','#8B0000','#4B0082','#2F4F4F'] },
      'True Spring':   { best:['#FF9050','#FFD060','#A8D098','#60A8A0','#F0A050','#E8C090'], avoid:['#000080','#8B4513','#483D8B','#696969'] },
      'Warm Spring':   { best:['#F4A460','#DEB887','#8FBC8F','#CD853F','#DAA520','#BC8F5F'], avoid:['#483D8B','#191970','#8B008B','#4169E1'] },
      'True Autumn':   { best:['#C4542A','#8B6914','#556B2F','#8B2500','#D4956A','#2E8B57'], avoid:['#FF69B4','#87CEEB','#E0E0E0','#FFB6C1'] },
      'Deep Autumn':   { best:['#8B2500','#4A3728','#2D5016','#7B3F00','#B8860B','#556B2F'], avoid:['#FFB6C1','#E0F0FF','#FFFACD','#D3D3D3'] },
      'Soft Autumn':   { best:['#B8997A','#C4A882','#8B7355','#A0856C','#9CAF88','#B5A898'], avoid:['#FF0000','#0000FF','#FFFF00','#FF69B4'] },
      'Light Summer':  { best:['#B0C4D8','#D4A8C0','#B0D4C0','#C8B0D4','#D4C4B0','#B8D0E0'], avoid:['#FF4500','#8B4513','#006400','#8B0000'] },
      'True Summer':   { best:['#9BB7D4','#C4A8C0','#A8C4B0','#B8A8D4','#D4B0A8','#88A8C0'], avoid:['#FF6600','#FFD700','#8B0000','#006400'] },
      'Cool Summer':   { best:['#8B9BB8','#B08898','#8BA898','#9888B0','#B8A090','#7A90A8'], avoid:['#FF8C00','#FFD700','#8B4513','#228B22'] },
      'True Winter':   { best:['#1A1A6E','#8B0000','#006400','#4B0082','#00008B','#C4542A'], avoid:['#DEB887','#F4A460','#8B7355','#D2B48C'] },
      'Deep Winter':   { best:['#000080','#8B0000','#1A1A1A','#4B0082','#006400','#2C2C54'], avoid:['#F5DEB3','#FFE4B5','#D2B48C','#F0E68C'] },
      'Bright Winter': { best:['#FF0080','#00BFFF','#FF4500','#7B68EE','#00CED1','#FF1493'], avoid:['#B8860B','#8B7355','#A0856C','#9CAF88'] },
    };

    function rgbToLab(r, g, b) {
      let rn = r/255, gn = g/255, bn = b/255;
      rn = rn > 0.04045 ? Math.pow((rn+0.055)/1.055, 2.4) : rn/12.92;
      gn = gn > 0.04045 ? Math.pow((gn+0.055)/1.055, 2.4) : gn/12.92;
      bn = bn > 0.04045 ? Math.pow((bn+0.055)/1.055, 2.4) : bn/12.92;
      const X=(rn*0.4124564+gn*0.3575761+bn*0.1804375)/0.95047;
      const Y=(rn*0.2126729+gn*0.7151522+bn*0.0721750)/1.00000;
      const Z=(rn*0.0193339+gn*0.1191920+bn*0.9503041)/1.08883;
      const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116;
      const fx=f(X), fy=f(Y), fz=f(Z);
      const L=116*fy-16, a=500*(fx-fy), bv=200*(fy-fz);
      return { L, a, b:bv, C:Math.sqrt(a*a+bv*bv) };
    }

    function mapToColorSeason(lab) {
      const { L, b:bv, C } = lab;
      const temp  = bv > 8 ? 'warm' : bv < 4 ? 'cool' : 'neutral';
      const value  = L  > 68 ? 'light' : L < 52 ? 'deep' : 'medium';
      const chroma = C  > 22 ? 'bright' : C < 16 ? 'muted' : 'medium';
      let season;
      if (temp==='warm'  && value==='light'  && chroma==='bright') season='Light Spring';
      else if (temp==='warm'  && value==='light')                   season='True Spring';
      else if (temp==='warm'  && value==='medium' && chroma==='bright') season='Warm Spring';
      else if (temp==='warm'  && value==='deep'  && chroma==='bright') season='True Autumn';
      else if (temp==='warm'  && value==='deep')                    season='Deep Autumn';
      else if (temp==='neutral' && bv >= 4)                         season='Soft Autumn';
      else if (temp==='cool'  && value==='light'  && chroma==='muted')  season='Light Summer';
      else if (temp==='cool'  && value==='light')                   season='True Summer';
      else if (temp==='cool'  && value==='medium')                  season='Cool Summer';
      else if (temp==='cool'  && value==='deep'  && chroma==='bright')  season='True Winter';
      else if (temp==='cool'  && value==='deep')                    season='Deep Winter';
      else if (chroma==='bright')                                   season='Bright Winter';
      else                                                          season='Soft Autumn';
      const pal = SEASON_PALETTES[season] || { best:['#C4542A','#8B7355','#4A6B8A','#2A8B55','#9B89B4','#D4956A'], avoid:['#1A1A1A','#FF69B4','#FFD700','#00FF00'] };
      return {
        season, value, chroma,
        undertone: temp==='warm' ? 'warm golden undertone' : temp==='cool' ? 'cool pink/blue undertone' : 'neutral undertone',
        bestColors: pal.best, avoidColors: pal.avoid,
      };
    }

    function undertoneToColorProfile(undertone, colorAffinity) {
      const key = undertone + '_' + (colorAffinity || 'neutral');
      const map = {
        warm_warm:'True Autumn', warm_cool:'Warm Spring', warm_neutral:'Soft Autumn', warm_bold:'True Autumn',
        cool_cool:'Cool Summer', cool_warm:'True Winter', cool_neutral:'Light Summer', cool_bold:'True Winter',
        neutral_warm:'Soft Autumn', neutral_cool:'Cool Summer', neutral_neutral:'True Summer', neutral_bold:'Bright Winter',
      };
      const season = map[key] || 'Soft Autumn';
      const pal = SEASON_PALETTES[season] || { best:[], avoid:[] };
      return {
        season, undertone: undertone + ' undertone', value:'medium', chroma:'medium',
        bestColors: pal.best, avoidColors: pal.avoid, analysisMethod:'quiz',
      };
    }

    /* ========================================================
       PROFILE MANAGEMENT
    ======================================================== */
    const PROFILES_STORE_KEY = 'eslucent_profiles';
    const ACTIVE_PROFILE_KEY = 'eslucent_active_id';

    function loadAllProfiles() {

    const CAPSULE_ESSENTIALS = {

    /* ========================================================
       SCAN SCREEN — Real MediaPipe Pose + Face Mesh
    ======================================================== */
    function ScanScreen({ onComplete, existingFitProfile }) {
      const videoRef       = useRef(null);
      const canvasRef      = useRef(null);
      const poseModelRef   = useRef(null);
      const faceMeshRef    = useRef(null);
      const streamRef      = useRef(null);
      const bodyResultsRef = useRef(null);
      const colorResultsRef= useRef(null);
      const stableFrames   = useRef(0);
      const colorFrames    = useRef(0);
      const scanStateRef   = useRef('cam-init');
      const activeRef      = useRef(true);

      const [scanState,  setScanStateRaw] = useState('cam-init');
      const [bodyProgress, setBodyProgress] = useState(0);
      const [bodyData,   setBodyData]    = useState(null);
      const [undertone,  setUndertone]   = useState(null);
      const [manualData, setManualData]  = useState({
        height:    existingFitProfile?.height    ? String(existingFitProfile.height)    : '',
        shoulders: existingFitProfile?.shoulders ? String(existingFitProfile.shoulders) : '',
        hips:      existingFitProfile?.hips      ? String(existingFitProfile.hips)      : '',
      });
      const [cameraError, setCameraError] = useState('');
      const [retryKey,   setRetryKey]    = useState(0);

      function setScanState(s) { scanStateRef.current = s; setScanStateRaw(s); }

      /* ---- Pose results handler (PoseNet keypoints — position.x/y format) ---- */
      function handlePoseResults(keypoints) {
        if (!canvasRef.current || !videoRef.current) return;
        if (scanStateRef.current !== 'body-align' && scanStateRef.current !== 'body-measuring') return;

        const canvas = canvasRef.current;
        const ctx    = canvas.getContext('2d');
        const W = videoRef.current.videoWidth  || 640;
        const H = videoRef.current.videoHeight || 480;
        if (canvas.width !== W)  canvas.width  = W;
        if (canvas.height !== H) canvas.height = H;
        ctx.clearRect(0, 0, W, H);

        if (!keypoints || keypoints.length < 17) { stableFrames.current = 0; return; }

        /* PoseNet keypoints use position.x / position.y */
        const px = kp => kp.position.x;
        const py = kp => kp.position.y;

        /* Draw skeleton */
        const connections = [[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
        ctx.strokeStyle = 'rgba(196,84,42,0.7)';
        ctx.lineWidth = 2;
        connections.forEach(([i, j]) => {
          const a = keypoints[i], b = keypoints[j];
          if (a && b && a.score > 0.3 && b.score > 0.3) {
            ctx.beginPath(); ctx.moveTo(px(a), py(a)); ctx.lineTo(px(b), py(b)); ctx.stroke();
          }
        });
        [5,6,11,12,15,16].forEach(i => {
          const kp = keypoints[i];
          if (kp && kp.score > 0.3) {
            ctx.fillStyle = '#C4542A';
            ctx.beginPath(); ctx.arc(px(kp), py(kp), 4, 0, 2*Math.PI); ctx.fill();
          }
        });

        /* indices: 5=lShoulder 6=rShoulder 11=lHip 12=rHip 15=lAnkle 16=rAnkle */
        const required = [5, 6, 11, 12, 15, 16];
        const allVis = required.every(i => keypoints[i] && keypoints[i].score > 0.3);

        if (allVis) {
          stableFrames.current++;
          const prog = Math.min(100, Math.round(stableFrames.current / 60 * 100));
          setBodyProgress(prog);
          if (scanStateRef.current !== 'body-measuring') setScanState('body-measuring');

          if (stableFrames.current >= 60) {
            const kp  = i => keypoints[i];
            const dst = (a, b) => Math.sqrt((px(a)-px(b))**2 + (py(a)-py(b))**2);
            const mid = (a, b) => ({ position:{ x:(px(a)+px(b))/2, y:(py(a)+py(b))/2 } });
            const ls=kp(5), rs=kp(6), lh=kp(11), rh=kp(12), la=kp(15), ra=kp(16);
            const shoulderPx = dst(ls, rs);
            const hipPx      = dst(lh, rh);
            const torsoPx    = dst(mid(ls,rs), mid(lh,rh));
            const legPx      = dst(mid(lh,rh), mid(la,ra));
            const pxPerCm    = shoulderPx / 41;
            const shoulders  = Math.round(shoulderPx / pxPerCm);
            const hips       = Math.round(hipPx      / pxPerCm);
            const torso      = Math.round(torsoPx    / pxPerCm);
            const legs       = Math.round(legPx      / pxPerCm);
            const height     = Math.round(torso + legs + 26);
            const recSize    = shoulders<38?'XS':shoulders<40?'S':shoulders<42?'M':shoulders<44?'L':'XL';
            const diff       = shoulders - hips;
            const bodyShape  = Math.abs(diff)<5 ? 'Rectangle' : diff>=5 ? 'Inverted Triangle' : (hips-shoulders>=5 ? 'Pear' : 'Rectangle');
            const fp = { shoulders, hips, torso, height, recommendedSize:recSize, bodyShape, scanMethod:'camera' };
            bodyResultsRef.current = fp;
            setBodyData(fp);
            setScanState('body-done');
          }
        } else {
          if (stableFrames.current > 0) { stableFrames.current = 0; setBodyProgress(0); }
          if (scanStateRef.current !== 'body-align') setScanState('body-align');
        }
      }

      /* ---- Canvas skin sampling (no WASM — samples center-face region of video) ---- */
      function sampleSkinColor() {
        if (!videoRef.current || videoRef.current.readyState < 2) return null;
        try {
          const vid = videoRef.current;
          const W = vid.videoWidth  || 640;
          const H = vid.videoHeight || 480;
          const tmp = document.createElement('canvas');
          tmp.width = W; tmp.height = H;
          const tc = tmp.getContext('2d');
          tc.drawImage(vid, 0, 0, W, H);
          /* Sample forehead + cheek region: center 24% wide, rows 12–40% down */
          const x1 = Math.floor(W * 0.38), x2 = Math.floor(W * 0.62);
          const y1 = Math.floor(H * 0.12), y2 = Math.floor(H * 0.40);
          let totalR=0, totalG=0, totalB=0, count=0;
          for (let y = y1; y < y2; y += 4) {
            for (let x = x1; x < x2; x += 4) {
              const d = tc.getImageData(x, y, 1, 1).data;
              totalR += d[0]; totalG += d[1]; totalB += d[2]; count++;
            }
          }
          return count > 0 ? { r: totalR/count, g: totalG/count, b: totalB/count } : null;
        } catch(e) { return null; }
      }

      /* ---- Main async effect (re-runs on retry) ---- */
      useEffect(() => {
        activeRef.current = true;

        async function run() {
          /* 1 — Camera */
          setScanState('cam-init');
          if (!navigator.mediaDevices?.getUserMedia) {
            setCameraError('Camera requires HTTPS. Open the Netlify URL in Chrome — not the local file.');
            setScanState('manual-body');
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }
            });
            streamRef.current = stream;
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          } catch(e) {
            const msg = e.name === 'NotAllowedError'
              ? 'Camera blocked — click the camera icon in your browser address bar and allow access, then tap "Try camera again".'
              : e.name === 'NotFoundError'
              ? 'No camera found on this device.'
              : e.name === 'NotReadableError'
              ? 'Camera is in use by another app — close it and tap "Try camera again".'
              : 'Camera unavailable — make sure you opened the Netlify HTTPS link in Chrome.';
            setCameraError(msg);
            setScanState('manual-body');
            return;
          }

          /* 2 — PoseNet (WebGL, model weights bundled on jsDelivr — no TFHub download) */
          setScanState('pose-init');
          if (typeof posenet === 'undefined' || typeof tf === 'undefined') {
            setCameraError('Body detection library failed to load — using manual entry.');
            setScanState('manual-body');
            return;
          }
          try {
            await tf.ready();
            const net = await posenet.load({
              architecture: 'MobileNetV1',
              outputStride: 16,
              inputResolution: { width: 257, height: 257 },
              multiplier: 0.5,
            });
            poseModelRef.current = net;
          } catch(e) {
            setCameraError('Body detection failed to initialize — using manual entry.');
            setScanState('manual-body');
            return;
          }

          setScanState('body-align');

          const bodyTimeout = setTimeout(() => {
            if (scanStateRef.current === 'body-align') {
              setCameraError('Full body not detected in 15s — stand 1–2m back so your full body is in frame.');
              setScanState('manual-body');
            }
          }, 15000);

          /* 3 — Body scan frame loop */
          while (activeRef.current &&
                (scanStateRef.current === 'body-align' || scanStateRef.current === 'body-measuring')) {
            await new Promise(r => requestAnimationFrame(r));
            if (videoRef.current && videoRef.current.readyState >= 2 && poseModelRef.current) {
              try {
                const pose = await poseModelRef.current.estimateSinglePose(videoRef.current, { flipHorizontal: false });
                if (pose) handlePoseResults(pose.keypoints);
              } catch(e) {}
            }
          }
          clearTimeout(bodyTimeout);
          try { poseModelRef.current && poseModelRef.current.dispose(); } catch(e) {}
          if (!activeRef.current || scanStateRef.current !== 'body-done') return;

          /* Pause to let user see results */
          await new Promise(r => setTimeout(r, 1100));
          if (!activeRef.current) return;

          /* 4 — Canvas skin sampling (instant — no model download) */
          setScanState('color-init');
          await new Promise(r => setTimeout(r, 400)); /* brief pause so UI updates */
          colorFrames.current = 0;
          setScanState('color-scan');

          const colorTimeout = setTimeout(() => {
            if (scanStateRef.current === 'color-scan') setScanState('undertone-pick');
          }, 8000);

          /* 5 — Accumulate samples across 30 frames then decide */
          let rSum=0, gSum=0, bSum=0, sampleCount=0;
          while (activeRef.current && scanStateRef.current === 'color-scan') {
            await new Promise(r => requestAnimationFrame(r));
            const px = sampleSkinColor();
            if (px) { rSum += px.r; gSum += px.g; bSum += px.b; sampleCount++; }
            if (sampleCount >= 30 && !colorResultsRef.current) {
              const lab = rgbToLab(rSum/sampleCount, gSum/sampleCount, bSum/sampleCount);
              const cp  = mapToColorSeason(lab);
              cp.analysisMethod = 'camera';
              colorResultsRef.current = cp;
              setScanState('color-done');
            }
          }
          clearTimeout(colorTimeout);

          if (!activeRef.current) return;

          if (scanStateRef.current === 'color-done' && colorResultsRef.current) {
            onComplete(bodyResultsRef.current, colorResultsRef.current);
          }
          /* if undertone-pick, user completes via button */
        }

        run().catch(err => {
          console.warn('ScanScreen run() error:', err);
          setCameraError('Scan encountered an error — please use manual entry.');
          setScanState('manual-body');
        });

        return () => {
          activeRef.current = false;
          try { poseModelRef.current && poseModelRef.current.close(); } catch(e) {}
          streamRef.current && streamRef.current.getTracks().forEach(t => t.stop());
        };
      }, [retryKey]);

      /* ---- Manual body fallback ---- */
      function handleManualSubmit() {
        const h  = parseFloat(manualData.height)    || 165;
        const s  = parseFloat(manualData.shoulders) || 41;
        const hi = parseFloat(manualData.hips)      || 95;
        const recSize   = s<38?'XS':s<40?'S':s<42?'M':s<44?'L':'XL';
        const diff      = s - hi;
        const bodyShape = Math.abs(diff)<5?'Rectangle':diff>=5?'Inverted Triangle':hi-s>=5?'Pear':'Rectangle';
        const fp = { shoulders:s, hips:hi, torso:Math.round(h*0.32), height:h, recommendedSize:recSize, bodyShape, scanMethod:'manual' };
        bodyResultsRef.current = fp;
        setBodyData(fp);
        setScanState('undertone-pick');
      }

      /* ---- Undertone fallback ---- */
      function handleUndertoneSelect(u) { setUndertone(u); }
      function handleUndertoneContinue() {
        if (!undertone) return;
        const cp = undertoneToColorProfile(undertone, 'neutral');
        colorResultsRef.current = cp;
        onComplete(bodyResultsRef.current, cp);
      }

      /* ---- Derived display values ---- */
      const showCamera  = ['body-align','body-measuring','body-done','color-init','color-scan'].includes(scanState);
      const headerLabel = ['body-align','body-measuring','body-done','pose-init','cam-init'].includes(scanState) ? 'Body Scan' : 'Color Analysis';
      const statusLabels = {
        'cam-init':'Requesting camera…', 'pose-init':'Loading body detection…',
        'body-align':'Stand back — full body in frame', 'body-measuring':'Hold still — measuring…',
        'body-done':'Body scan complete', 'color-init':'Preparing color scan…',
        'color-scan':'Look directly at the camera — face centered',
      };

      return (
        <div className="screen scan-screen">
          <header className="ext-header" style={{background:'#1a1a1a',borderColor:'rgba(255,255,255,0.08)'}}>
            <span className="ext-logo" style={{color:'#fff'}}>esl<span style={{color:C.accent}}>ucent</span></span>
            <span style={{fontSize:'11px',color:'#888',letterSpacing:'0.08em',textTransform:'uppercase'}}>{headerLabel}</span>
          </header>

          {/* Loading states shown before camera is live */}
          {['cam-init','pose-init'].includes(scanState) && (
            <div className="scan-placeholder">
              <div className="loading-spinner" style={{width:'28px',height:'28px',margin:'0 auto 10px'}} />
              <div className="scan-placeholder-title" style={{fontSize:'12px'}}>{statusLabels[scanState]}</div>
            </div>
          )}

          {/* ---- Camera area — always mounted so videoRef is never null ---- */}
          <div className="scan-camera-area" style={{display: showCamera ? 'block' : 'none'}}>
            <video ref={videoRef} autoPlay playsInline muted style={{display:'block',width:'100%',height:'100%',objectFit:'cover'}} />
            <canvas ref={canvasRef} style={{position:'absolute',inset:0,width:'100%',height:'100%'}} />
            <div className="corner-bracket tl" style={{zIndex:3}} />
            <div className="corner-bracket tr" style={{zIndex:3}} />
            <div className="corner-bracket bl" style={{zIndex:3}} />
            <div className="corner-bracket br" style={{zIndex:3}} />
            {scanState === 'body-align' && (
              <div className="scan-overlay-label">Stand back — full body in frame</div>
            )}
            {scanState === 'color-scan' && (
              <div className="scan-overlay-label">Look directly at the camera</div>
            )}
            {scanState === 'body-measuring' && (
              <div className="scan-measuring-bar">
                <div className="scan-measuring-bar-label">Hold still — measuring…</div>
                <div className="scan-measuring-bar-track">
                  <div className="scan-measuring-bar-fill" style={{width:`${bodyProgress}%`}} />
                </div>
              </div>
            )}
            {scanState === 'color-init' && (
              <div className="scan-init-overlay">
                <div className="loading-spinner" style={{width:'26px',height:'26px'}} />
                <div className="scan-init-text">{statusLabels['color-init']}</div>
              </div>
            )}
          </div>

          {/* Placeholder shown when camera is not active */}
          {!showCamera && scanState === 'manual-body' && (
            <div className="scan-placeholder">
              <div className="scan-placeholder-icon">📐</div>
              <div className="scan-placeholder-title">Enter Measurements</div>
              <div className="scan-placeholder-sub">Enter your measurements below for a precise size recommendation.</div>
            </div>
          )}
          {!showCamera && scanState === 'undertone-pick' && (
            <div className="scan-placeholder" style={{height:'180px'}}>
              <div className="scan-placeholder-icon">🎨</div>
              <div className="scan-placeholder-title">Identify Your Color Season</div>
              <div className="scan-placeholder-sub">Select the undertone that best describes your complexion.</div>
            </div>
          )}

          {/* ---- Info panel ---- */}
          <div className="scan-info-panel">

            {/* Body scanning */}
            {(scanState === 'body-align' || scanState === 'body-measuring') && (
              <>
                <div className="scan-status">
                  <div className="scan-status-dot" />
                  <span className="scan-status-text">{statusLabels[scanState]}</span>
                </div>
                <div className="scan-measurements" style={{gridTemplateColumns:'repeat(2,1fr)'}}>
                  {[{k:'shoulders',l:'Shoulders'},{k:'hips',l:'Hips'},{k:'torso',l:'Torso'},{k:'height',l:'Est. Height'}].map(({k,l}) => (
                    <div key={k} className={`scan-meas-item${bodyData?.[k]?' active':''}`}>
                      <div className="scan-meas-value">
                        {bodyData?.[k]
                          ? <>{bodyData[k]}<span style={{fontSize:'11px',color:C.secondary,marginLeft:'1px'}}>cm</span></>
                          : <div className="scan-meas-loading" />}
                      </div>
                      <div className="scan-meas-label">{l}</div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* Body done */}
            {scanState === 'body-done' && bodyData && (
              <>
                <div className="scan-status">
                  <span style={{fontSize:'16px'}}>✅</span>
                  <span className="scan-status-text">Body scan complete</span>
                </div>
                <div className="scan-result-card">
                  <div className="scan-result-eyebrow">Your Recommended Size</div>
                  <div className="scan-result-size">{bodyData.recommendedSize}</div>
                  <div className="scan-result-sub">{bodyData.bodyShape} frame · {bodyData.shoulders}cm shoulders · {bodyData.hips}cm hips</div>
                </div>
                <div style={{fontSize:'12px',color:C.muted,textAlign:'center'}}>Analyzing your color profile next…</div>
              </>
            )}

            {/* Color scanning */}
            {scanState === 'color-init' && (
              <div style={{textAlign:'center',padding:'16px 0',color:C.secondary,fontSize:'13px'}}>Loading color analysis…</div>
            )}
            {(scanState === 'cam-init' || scanState === 'pose-init') && (
              <div style={{textAlign:'center',padding:'8px 0'}}>
                <button
                  className="btn-ghost"
                  style={{fontSize:'11px',padding:'7px 16px'}}
                  onClick={() => { setCameraError(''); setScanState('manual-body'); }}
                >
                  Skip — enter measurements manually
                </button>
              </div>
            )}
            {scanState === 'color-scan' && (
              <>
                <div className="scan-status">
                  <div className="scan-status-dot" />
                  <span className="scan-status-text">Analyzing skin tone and color profile…</span>
                </div>
                <div style={{background:C.card,borderRadius:'8px',padding:'14px',textAlign:'center',fontSize:'12px',color:C.secondary,lineHeight:1.6}}>
                  Hold your face steady in the frame. We're sampling your skin tone to determine your color season.
                </div>
              </>
            )}

            {/* Manual body form */}
            {scanState === 'manual-body' && (
              <div className="manual-input-wrap">
                {cameraError && (
                  <div style={{
                    background:'rgba(196,84,42,0.08)',
                    border:'1px solid rgba(196,84,42,0.2)',
                    borderRadius:'6px', padding:'10px 12px',
                    fontSize:'11px', color:C.accent, lineHeight:1.5,
                    marginBottom:'10px',
                  }}>
                    {cameraError}
                  </div>
                )}
                {cameraError && (cameraError.includes('allow') || cameraError.includes('in use')) && (
                  <button
                    className="btn-ghost"
                    style={{width:'100%',marginBottom:'12px',fontSize:'11px'}}
                    onClick={() => { setCameraError(''); setRetryKey(k => k + 1); }}
                  >
                    ↺ Try camera again
                  </button>
                )}
                {!cameraError && (
                  <div style={{fontSize:'11px',color:C.muted,marginBottom:'12px',lineHeight:1.5}}>
                    Enter your measurements to calculate your fit profile.
                  </div>
                )}
                {[
                  {k:'height',    label:'Height (cm)',         placeholder:'e.g. 165'},
                  {k:'shoulders', label:'Shoulder Width (cm)', placeholder:'e.g. 41'},
                  {k:'hips',      label:'Hip Width (cm)',       placeholder:'e.g. 95'},
                ].map(({k,label,placeholder}) => (
                  <div key={k} className="manual-input-row">
                    <label className="manual-input-label">{label}</label>
                    <input
                      type="number" placeholder={placeholder}
                      value={manualData[k]}
                      onChange={e => setManualData(prev => ({...prev,[k]:e.target.value}))}
                      className="manual-input-field"
                    />
                  </div>
                ))}
                <button className="btn-primary" onClick={handleManualSubmit} style={{marginTop:'4px'}}>
                  Calculate My Size →
                </button>
              </div>
            )}

            {/* Undertone picker */}
            {scanState === 'undertone-pick' && (
              <>
                <div style={{fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:C.accent,fontWeight:'500',marginBottom:'12px'}}>
                  What best describes your skin?
                </div>
                <div className="undertone-grid">
                  {[
                    {id:'warm',    label:'Warm',    desc:'Golden or peachy', swatch:'#D4956A'},
                    {id:'cool',    label:'Cool',    desc:'Pink or bluish',   swatch:'#9BB7D4'},
                    {id:'neutral', label:'Neutral', desc:'Mix of both',      swatch:'#C4A882'},
                  ].map(u => (
                    <div
                      key={u.id}
                      className={`undertone-card${undertone===u.id?' selected':''}`}
                      onClick={() => handleUndertoneSelect(u.id)}
                    >
                      <div className="undertone-swatch" style={{background:u.swatch}} />
                      <div className="undertone-label">{u.label}</div>
                      <div className="undertone-desc">{u.desc}</div>
                    </div>
                  ))}
                </div>
                <button
                  className="btn-primary"
                  onClick={handleUndertoneContinue}
                  disabled={!undertone}
                  style={{opacity:undertone?1:0.45, cursor:undertone?'pointer':'default'}}
                >
                  See My Color Profile →
                </button>
              </>
            )}

            {scanState === 'cam-init' && (
              <div style={{textAlign:'center',padding:'20px 0',color:C.secondary,fontSize:'13px'}}>Requesting camera access…</div>
            )}
          </div>
        </div>
      );
    }

    /* ========================================================
       QUIZ SCREEN
    ======================================================== */
    function seasonToColorAffinity(season) {
      if (!season) return null;
      if (['Bright Winter'].includes(season)) return 'bold';
      if (['True Summer','Cool Summer','Light Summer','True Winter','Deep Winter'].includes(season)) return 'cool';
      if (['Soft Autumn'].includes(season)) return 'neutral';
      return 'warm';
    }

    function QuizScreen({ onComplete, colorProfile }) {
      const detectedSeason = colorProfile?.season;
      const derivedAffinity = seasonToColorAffinity(detectedSeason);
      const startIndex = detectedSeason ? 1 : 0;

      const [qIndex, setQIndex] = useState(startIndex);
      const [answers, setAnswers] = useState(() =>
        derivedAffinity ? { 1: derivedAffinity } : {}
      );
      const q = QUIZ_QUESTIONS[qIndex];
      const progress = (qIndex / QUIZ_QUESTIONS.length) * 100;
      const selected = answers[q.id];

      function select(optionId) {
        setAnswers(prev => ({ ...prev, [q.id]: optionId }));
      }

      function next() {
        if (!selected) return;
        if (qIndex < QUIZ_QUESTIONS.length - 1) {
          setQIndex(i => i + 1);
        } else {
          onComplete({
            colorAffinity:   answers[1],
            fitPreference:   answers[2],
            lifestyle:       answers[3],
            material:        answers[4],
            archetype:       answers[5],
          });
        }
      }

      function back() {
        if (qIndex > 0) setQIndex(i => i - 1);
      }

      return (
        <div className="screen quiz-screen">
          <header className="ext-header">
            <span className="ext-logo">esl<span style={{color:C.accent}}>ucent</span></span>
            <div className="ext-header-actions">
              {qIndex > 0 && (
                <button className="btn-ghost" onClick={back} style={{padding:'6px 12px',fontSize:'12px'}}>← Back</button>
              )}
            </div>
          </header>

          {detectedSeason && (
            <div style={{
              display:'flex',alignItems:'center',gap:'8px',
              padding:'8px 20px',
              background:'rgba(196,84,42,0.07)',
              borderBottom:'1px solid rgba(196,84,42,0.12)',
              fontSize:'11px',color:C.secondary,
            }}>
              <div style={{width:'8px',height:'8px',borderRadius:'50%',background:colorProfile?.bestColors?.[0]||C.accent,flexShrink:0}} />
              <span>Color season detected from scan: <strong style={{color:C.accent}}>{detectedSeason}</strong></span>
            </div>
          )}
          <div className="progress-label">
            <span>{q.category}</span>
            <span>{qIndex + 1} of {QUIZ_QUESTIONS.length}</span>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{width: `${progress + (100/QUIZ_QUESTIONS.length)}%`}} />
          </div>

          <div className="quiz-body">
            <div className="quiz-q-number">Question {qIndex + 1}</div>
            <h2 className="quiz-q-title">{q.title}</h2>
            <p className="quiz-q-subtitle">{q.subtitle}</p>

            <div className={`quiz-options${['color','archetype'].includes(q.type) ? '' : ' grid-2'}`}>
              {q.options.map(opt => (
                <div
                  key={opt.id}
                  className={`quiz-option${selected === opt.id ? ' selected' : ''}`}
                  onClick={() => select(opt.id)}
                >
                  {q.type === 'color' && (
                    <>
                      <div className="quiz-option-label">{opt.label}</div>
                      <div className="quiz-option-desc">{opt.desc}</div>
                      <div className="color-swatches">
                        {opt.swatches.map((s,i) => (
                          <div key={i} className="color-swatch" style={{background: s}} />
                        ))}
                      </div>
                    </>
                  )}
                  {q.type === 'silhouette' && (
                    <>
                      <div className="quiz-option-icon">{opt.icon}</div>
                      <div className="quiz-option-label">{opt.label}</div>
                      <div className="quiz-option-desc">{opt.desc}</div>
                    </>
                  )}
                  {q.type === 'lifestyle' && (
                    <>
                      <div className="quiz-option-icon">{opt.icon}</div>
                      <div className="quiz-option-label">{opt.label}</div>
                      <div className="quiz-option-desc">{opt.desc}</div>
                    </>
                  )}
                  {q.type === 'material' && (
                    <>
                      <div className="texture-preview" style={{background: opt.bg}} />
                      <div className="quiz-option-label">{opt.label}</div>
                      <div className="quiz-option-desc" style={{fontSize:'11px'}}>{opt.desc}</div>
                    </>
                  )}
                  {q.type === 'archetype' && (
                    <>
                      <img className="mood-image" src={opt.img} alt={opt.label} loading="lazy" />
                      <div className="quiz-option-label">{opt.label}</div>
                      <div className="quiz-option-desc">{opt.desc}</div>
                    </>
                  )}
                </div>
              ))}
            </div>
          </div>

          <div className="quiz-footer">
            <button
              className="btn-primary"
              onClick={next}
              disabled={!selected}
              style={{opacity: selected ? 1 : 0.45, cursor: selected ? 'pointer' : 'default'}}
            >
              {qIndex < QUIZ_QUESTIONS.length - 1 ? 'Continue →' : 'See My Profile →'}
            </button>
          </div>
        </div>
      );
    }

    /* ========================================================
       PROFILE CARD SCREEN
    ======================================================== */
    /* ========================================================
       BODY SHAPE SVG + PROFILE CARD — 4-section redesign
    ======================================================== */
    function BodyShapeSVG({ shape }) {
      const shapes = {
        'Rectangle':         'M28,12 L72,12 L72,88 L28,88 Z',
        'Pear':              'M34,12 L66,12 L76,88 L24,88 Z',
        'Inverted Triangle': 'M20,12 L80,12 L66,88 L34,88 Z',
        'Hourglass':         'M28,12 L72,12 L60,50 L72,88 L28,88 L40,50 Z',
      };
      const d = shapes[shape] || shapes['Rectangle'];
      return (
        <svg viewBox="0 0 100 100" width="52" height="52" style={{display:'block',flexShrink:0}}>
          <path d={d} fill="rgba(196,84,42,0.18)" stroke="rgba(196,84,42,0.6)" strokeWidth="2.5" strokeLinejoin="round"/>
        </svg>
      );
    }

    function ProfileCard({ profile, onContinue, onSave, onRetake }) {
      const [saved, setSaved] = useState(false);
      const { fitProfile, colorProfile, styleProfile, recommendations } = profile || {};

      const season    = colorProfile?.season    || '—';
      const undertone = colorProfile?.undertone || '—';
      const bestColors  = colorProfile?.bestColors  || [];
      const avoidColors = colorProfile?.avoidColors || [];
      const bodyShape = fitProfile?.bodyShape       || 'Rectangle';
      const recSize   = fitProfile?.recommendedSize || '—';
      const archetype = styleProfile?.archetype
        ? styleProfile.archetype.charAt(0).toUpperCase() + styleProfile.archetype.slice(1)
        : '—';
      const capsule = (recommendations?.capsuleEssentials || []).slice(0, 3);

      const fitLabels  = { oversized:'Oversized', relaxed:'Relaxed', fitted:'Fitted', tailored:'Tailored' };
      const lifeLabels = { casual:'Casual', professional:'Professional', evening:'Evening', active:'Active' };
      const matLabels  = { soft:'Soft & Fluid', structured:'Structured', lightweight:'Lightweight', textured:'Textured' };

      const seasonDesc = season !== '—' ? `${season.toLowerCase()} tones` : 'your seasonal palette';
      const summary = [
        `As a ${season}, your ${undertone}-toned complexion thrives in ${seasonDesc}.`,
        `Your ${bodyShape} build suits ${fitLabels[styleProfile?.fitPreference] || 'well-proportioned'} silhouettes`,
        `in ${matLabels[styleProfile?.material] || 'quality'} fabrics.`,
        `A ${archetype} at heart — look for clean, intentional pieces that reflect your palette.`,
      ].join(' ');

      function handleSave() {
        if (onSave) onSave(profile);
        setSaved(true);
      }

      function handleSaveAndContinue() {
        if (!saved && onSave) onSave(profile);
        onContinue();
      }

      return (
        <div className="screen profile-screen" style={{overflowY:'auto'}}>
          <header className="ext-header">
            <span className="ext-logo">esl<span style={{color:C.accent}}>ucent</span></span>
            <button className="btn-ghost" onClick={onRetake} style={{fontSize:'11px',padding:'6px 10px'}}>
              Retake
            </button>
          </header>

          <div className="profile-hero" style={{paddingBottom:'14px'}}>
            <div className="profile-eyebrow">Your Eslucent Profile</div>
            <div className="profile-name-label">{archetype} · {season}</div>
          </div>

          {/* Section 1 — Fit Profile */}
          <div className="profile-section">
            <div className="profile-section-eyebrow">Fit Profile</div>
            <div className="body-shape-row">
              <BodyShapeSVG shape={bodyShape} />
              <div>
                <div className="body-shape-name">{bodyShape}</div>
                <div style={{fontSize:'11px',color:C.muted,marginBottom:'4px'}}>Recommended size</div>
                <span className="body-shape-size-badge">{recSize}</span>
              </div>
            </div>
            <div className="meas-grid-4">
              {[
                { k:'shoulders', label:'Shoulders' },
                { k:'hips',      label:'Hips'      },
                { k:'torso',     label:'Torso'     },
                { k:'height',    label:'Height'    },
              ].map(({ k, label }) => (
                <div key={k} className="meas-cell">
                  <div className="meas-cell-val">
                    {fitProfile?.[k] ?? '—'}
                    <span className="meas-cell-unit">{fitProfile?.[k] ? 'cm' : ''}</span>
                  </div>
                  <div className="meas-cell-key">{label}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Section 2 — Color Profile */}
          <div className="profile-section">
            <div className="profile-section-eyebrow">Color Profile</div>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}}>
              {bestColors[0] && (
                <div style={{width:'12px',height:'12px',borderRadius:'50%',background:bestColors[0],flexShrink:0}} />
              )}
              <span style={{fontWeight:700,fontSize:'14px',color:C.text}}>{season}</span>
              <span style={{fontSize:'11px',color:C.secondary}}>· {undertone} undertone</span>
            </div>
            {bestColors.length > 0 && (
              <>
                <div className="palette-row-label">Wear</div>
                <div className="palette-swatches">
                  {bestColors.map((hex, i) => (
                    <div key={i} className="palette-swatch" style={{background:hex}} title={hex} />
                  ))}
                </div>
              </>
            )}
            {avoidColors.length > 0 && (
              <>
                <div className="palette-row-label" style={{marginTop:'6px'}}>Avoid</div>
                <div className="palette-swatches">
                  {avoidColors.map((hex, i) => (
                    <div key={i} className="palette-swatch avoid" style={{background:hex}} title={hex} />
                  ))}
                </div>
              </>
            )}
          </div>

          {/* Section 3 — Style Profile */}
          <div className="profile-section">
            <div className="profile-section-eyebrow">Style Profile</div>
            <div className="style-tags-pills">
              {[
                archetype,
                fitLabels[styleProfile?.fitPreference],
                lifeLabels[styleProfile?.lifestyle],
                matLabels[styleProfile?.material],
              ].filter(Boolean).map((tag, i) => (
                <span key={i} className="style-pill">{tag}</span>
              ))}
            </div>
            {capsule.length > 0 && (
              <ul className="capsule-list">
                {capsule.map((item, i) => (
                  <li key={i} className="capsule-item">
                    <div className="capsule-dot" />
                    {item}
                  </li>
                ))}
              </ul>
            )}
          </div>

          {/* Section 4 — Shopping Summary */}
          <div className="profile-section">
            <div className="profile-section-eyebrow">Shopping Summary</div>
            <div className="shopping-summary-text">{summary}</div>
          </div>

          <div className="profile-actions">
            <button className="btn-primary" onClick={handleSaveAndContinue}>
              {saved ? 'See Matched Products →' : 'Save & See Products →'}
            </button>
            {!saved && (
              <button
                className="btn-ghost"
                onClick={onContinue}
                style={{width:'100%',textAlign:'center'}}
              >
                Skip saving →
              </button>
            )}
            <div className="profile-save-note" style={{textAlign:'center'}}>
              {saved
                ? 'Profile saved — available across all brands.'
                : 'Profile will be saved locally. Never shared without consent.'
              }
            </div>
          </div>
        </div>
      );
    }

    /* ========================================================
       ESLUCENT FILTER BAR
    ======================================================== */

    function StoreOverlay({ profile, onEditProfile, onViewDashboard }) {
      const [sortMode, setSortMode] = useState('best');
      const [priceRange, setPriceRange] = useState('all');
      const [mySizeOnly, setMySizeOnly] = useState(false);
      const [myColorSeasonOnly, setMyColorSeasonOnly] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });
      const [overlayActive, setOverlayActive] = useState(true);

      const season = deriveColorSeason(
        profile?.tasteProfile?.colorAffinity,
        profile?.tasteProfile?.material
      );
      const archetype = profile?.tasteProfile?.archetype
        ? profile.tasteProfile.archetype.charAt(0).toUpperCase() + profile.tasteProfile.archetype.slice(1)
        : 'Your Style';

      const scored = PRODUCTS.map(p => ({ ...p, matchScore: computeMatchScore(p, profile) }));

      let displayed = [...scored];
      if (priceRange === 'under100')  displayed = displayed.filter(p => p.price < 100);
      if (priceRange === '100-200')   displayed = displayed.filter(p => p.price >= 100 && p.price <= 200);
      if (priceRange === 'over200')   displayed = displayed.filter(p => p.price > 200);
      if (overlayActive) {

        if (sortMode === 'price-low')  displayed.sort((a, b) => a.price - b.price);
        if (sortMode === 'price-high') displayed.sort((a, b) => b.price - a.price);
      }

      function handleProductClick(product, e) {
        if (selectedProduct?.id === product.id) { setSelectedProduct(null); return; }
        const rect = e.currentTarget.getBoundingClientRect();
        setTooltipPos({ x: rect.left + rect.width / 2, y: rect.top });

      return (

            archetype={archetype}

            onViewDashboard={onViewDashboard}

          {/* Filter Bar (only when overlay is active) */}
          {overlayActive && (
            <EslucentFilterBar
              sortMode={sortMode}
              onSortChange={setSortMode}
              priceRange={priceRange}
              onPriceRangeChange={setPriceRange}

          {selectedProduct && (
            <div style={{position:'fixed', inset:0, zIndex:349}} onClick={() => setSelectedProduct(null)} />
          )}

          {/* Tooltip */}
          {selectedProduct && overlayActive && (

          <div style={{
            padding:'12px 24px 28px',
            textAlign:'center',
            fontSize:'11px',
            fontStyle:'italic',
            color:'#8B7355',

            borderTop:'1px solid rgba(139,115,85,0.12)',

        </div>
      );
    }

    function DoughnutChart({ data, labels }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: ['#C4542A','#D4956A','#8B7355','#E8C5A8'],
              borderWidth: 0,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  font: { family: 'Inter', size: 11 },
                  color: '#8B7355',
                  boxWidth: 10,
                  padding: 12,
                }
              }
            }
          }
        });
        return () => chartRef.current?.destroy();
      }, []);
      return <canvas ref={canvasRef} />;
    }

    function BarChartComp({ data, labels }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: data.map((_, i) => i === 0 ? '#C4542A' : '#D4956A'),
              borderRadius: 3,
              borderSkipped: false,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: {
              x: {
                grid: { color: 'rgba(139,115,85,0.1)' },
                ticks: { font: { family:'Inter', size:10 }, color: '#8B7355' }
              },
              y: {
                grid: { display: false },
                ticks: { font: { family:'Inter', size:11 }, color: '#1A1A1A' }
              }
            }
          }
        });
        return () => chartRef.current?.destroy();
      }, []);
      return <canvas ref={canvasRef} />;
    }
