    function ProfilesScreen({ profiles, activeProfileId, onLoad, onDelete, onCompare, onBack }) {
      const [selected, setSelected] = useState([]);

      function toggleSelect(id) {
        setSelected(prev =>
          prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id].slice(-2)
        );
      }

      return (
        <div className="screen profiles-screen">
          <header className="ext-header">
            <button className="btn-ghost" onClick={onBack} style={{fontSize:'11px',padding:'6px 10px'}}>← Back</button>
            <span className="ext-logo" style={{fontSize:'14px'}}>My Profiles</span>
            <span style={{width:'60px'}} />
          </header>

          <div className="profiles-list">
            {profiles.length === 0 ? (
              <div className="profiles-empty">
                <div className="profiles-empty-icon">✦</div>
                <div className="profiles-empty-text">No saved profiles yet.</div>
                <div style={{fontSize:'12px',color:C.muted}}>Complete a scan to save your first profile.</div>
              </div>
            ) : profiles.map(p => {
              const arch   = p.styleProfile?.archetype || 'classic';
              const season = p.colorProfile?.season    || '—';
              const size   = p.fitProfile?.recommendedSize || '—';
              const isActive = p.id === activeProfileId;
              const isSel    = selected.includes(p.id);
              const seasonColor = p.colorProfile?.bestColors?.[0] || C.accent;
              return (
                <div key={p.id} className="profile-list-card" style={isSel ? {border:`1px solid ${C.accent}`} : {}}>
                  {isActive && (
                    <div className="plc-active-indicator">
                      <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#2A8B55'}} />
                      Active
                    </div>
                  )}
                  <div className="plc-top">
                    <div className="plc-name">
                      {arch.charAt(0).toUpperCase() + arch.slice(1)}
                    </div>
                    <div className="plc-season-pill" style={{background:seasonColor+'22',color:seasonColor}}>
                      {season}
                    </div>
                    <div className="plc-size-badge">{size}</div>
                  </div>
                  <div className="plc-date">
                    {p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '—'}
                  </div>
                  {(p.colorProfile?.bestColors || []).length > 0 && (
                    <div className="palette-swatches" style={{marginBottom:'10px'}}>
                      {p.colorProfile.bestColors.slice(0,5).map((hex, i) => (
                        <div key={i} className="palette-swatch" style={{background:hex,width:'18px',height:'18px'}} />
                      ))}
                    </div>
                  )}
                  <div className="plc-actions">
                    <button className="plc-btn primary" onClick={() => onLoad(p)}>
                      {isActive ? 'Go to Store' : 'Load'}
                    </button>
                    <button className="plc-btn danger" onClick={() => onDelete(p.id)}>
                      Delete
                    </button>
                    {profiles.length >= 2 && (
                      <button
                        className={`plc-btn${isSel ? ' primary' : ''}`}
                        onClick={() => toggleSelect(p.id)}
                      >
                        {isSel ? '✓ Compare' : 'Compare'}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {selected.length === 2 && (
            <div style={{padding:'12px 16px',borderTop:'1px solid rgba(196,84,42,0.15)'}}>
              <button className="btn-primary" style={{width:'100%'}} onClick={() => onCompare(selected)}>
                Compare Selected Profiles →
              </button>
            </div>
          )}
        </div>
      );
    }

    /* ========================================================
       COMPARE SCREEN
    ======================================================== */
    function CompareScreen({ profiles, onBack }) {
      const [a, b] = profiles;
      if (!a || !b) return null;

      const fitLabels  = { oversized:'Oversized', relaxed:'Relaxed', fitted:'Fitted', tailored:'Tailored' };
      const matLabels  = { soft:'Soft & Fluid', structured:'Structured', lightweight:'Lightweight', textured:'Textured' };

      const rows = [
        { label:'Season',     va: a.colorProfile?.season,            vb: b.colorProfile?.season },
        { label:'Undertone',  va: a.colorProfile?.undertone,         vb: b.colorProfile?.undertone },
        { label:'Body Shape', va: a.fitProfile?.bodyShape,           vb: b.fitProfile?.bodyShape },
        { label:'Size',       va: a.fitProfile?.recommendedSize,     vb: b.fitProfile?.recommendedSize },
        { label:'Shoulders',  va: a.fitProfile?.shoulders ? a.fitProfile.shoulders+'cm' : '—', vb: b.fitProfile?.shoulders ? b.fitProfile.shoulders+'cm' : '—' },
        { label:'Hips',       va: a.fitProfile?.hips ? a.fitProfile.hips+'cm' : '—',           vb: b.fitProfile?.hips ? b.fitProfile.hips+'cm' : '—' },
        { label:'Archetype',  va: a.styleProfile?.archetype,        vb: b.styleProfile?.archetype },
        { label:'Fit Style',  va: fitLabels[a.styleProfile?.fitPreference] || a.styleProfile?.fitPreference, vb: fitLabels[b.styleProfile?.fitPreference] || b.styleProfile?.fitPreference },
        { label:'Material',   va: matLabels[a.styleProfile?.material] || a.styleProfile?.material,            vb: matLabels[b.styleProfile?.material] || b.styleProfile?.material },
      ];

      function fmt(iso) { try { return new Date(iso).toLocaleDateString(); } catch { return '—'; } }

      return (
        <div className="screen compare-screen">
          <header className="ext-header">
            <button className="btn-ghost" onClick={onBack} style={{fontSize:'11px',padding:'6px 10px'}}>← Back</button>
            <span className="ext-logo" style={{fontSize:'14px'}}>Compare</span>
            <span style={{width:'60px'}} />
          </header>

          <div className="compare-body">
            {/* Column headers */}
            <div className="compare-cols" style={{marginBottom:'14px'}}>
              <div className="compare-col" style={{textAlign:'center',padding:'10px 8px'}}>
                <div style={{fontSize:'10px',color:C.secondary,marginBottom:'4px'}}>Profile A</div>
                <div style={{fontSize:'11px',fontWeight:600,color:C.text}}>{fmt(a.createdAt)}</div>
                {a.id === b.id && <div style={{fontSize:'10px',color:C.accent,marginTop:'2px'}}>Active</div>}
              </div>
              <div className="compare-vs">VS</div>
              <div className="compare-col" style={{textAlign:'center',padding:'10px 8px'}}>
                <div style={{fontSize:'10px',color:C.secondary,marginBottom:'4px'}}>Profile B</div>
                <div style={{fontSize:'11px',fontWeight:600,color:C.text}}>{fmt(b.createdAt)}</div>
              </div>
            </div>

            {/* Comparison rows */}
            {rows.map(({ label, va, vb }) => {
              const diff = (va || '—') !== (vb || '—');
              return (
                <div key={label} className="compare-field">
                  <div className="compare-field-label">{label}</div>
                  <div className="compare-cols">
                    <div className="compare-field-value" style={diff ? {color:C.accent} : {}}>{va || '—'}</div>
                    <div />
                    <div className="compare-field-value" style={diff ? {color:C.accent} : {}}>{vb || '—'}</div>
                  </div>
                  {diff && <div className="compare-diff">Different</div>}
                </div>
              );
            })}

            {/* Palettes side by side */}
            <div className="compare-field" style={{marginTop:'16px'}}>
              <div className="compare-field-label">Color Palette</div>
              <div className="compare-cols">
                <div className="palette-swatches">
                  {(a.colorProfile?.bestColors || []).slice(0,5).map((hex, i) => (
                    <div key={i} className="palette-swatch" style={{background:hex,width:'20px',height:'20px'}} />
                  ))}
                </div>
                <div />
                <div className="palette-swatches">
                  {(b.colorProfile?.bestColors || []).slice(0,5).map((hex, i) => (
                    <div key={i} className="palette-swatch" style={{background:hex,width:'20px',height:'20px'}} />
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ========================================================
       APP
    ======================================================== */
    function App() {
      const [screen,         setScreen]         = useState('welcome');
      const [fitProfile,     setFitProfile]     = useState(null);
      const [colorProfile,   setColorProfile]   = useState(null);
      const [tasteProfile,   setTasteProfile]   = useState(null);
      const [currentProfile, setCurrentProfile] = useState(null);
      const [savedProfiles,  setSavedProfiles]  = useState(() => loadAllProfiles());
      const [activeIdState,  setActiveIdState]  = useState(() => getActiveProfileId());
      const [compareIds,     setCompareIds]     = useState([]);

      const activeProfile = savedProfiles.find(p => p.id === activeIdState) || savedProfiles[0] || null;

      useEffect(() => {
        if (activeProfile) {
          setFitProfile(activeProfile.fitProfile || null);
          setColorProfile(activeProfile.colorProfile || null);
          setTasteProfile(activeProfile.styleProfile || null);
        }
      }, []);

      function handleWelcomeStart(mode) {
        if (mode === 'skip' && activeProfile) {
          setScreen('products');
        } else {
          setScreen('scan');
        }
      }

      function handleScanComplete(fp, cp) {
        setFitProfile(fp);
        setColorProfile(cp);
        setScreen('quiz');
      }

      function handleQuizComplete(tp) {
        setTasteProfile(tp);
        const prof = buildFullProfile(fitProfile, colorProfile, tp);
        setCurrentProfile(prof);
        setScreen('profile');
      }

      function handleSaveProfile(prof) {
        upsertProfile(prof);
        setActiveProfileId(prof.id);
        setSavedProfiles(loadAllProfiles());
        setActiveIdState(prof.id);
      }

      function handleLoadProfile(prof) {
        setFitProfile(prof.fitProfile || null);
        setColorProfile(prof.colorProfile || null);
        setTasteProfile(prof.styleProfile || null);
        setActiveProfileId(prof.id);
        setActiveIdState(prof.id);
        setScreen('products');
      }

      function handleDeleteProfile(id) {
        removeProfile(id);
        const updated = loadAllProfiles();
        setSavedProfiles(updated);
        if (activeIdState === id) {
          const nextId = updated[0]?.id || null;
          setActiveProfileId(nextId);
          setActiveIdState(nextId);
        }
      }

      function handleCompare(ids) {
        setCompareIds(ids);
        setScreen('compare');
      }

      const storeProfile = { fitProfile, tasteProfile };
      const inOverlayMode = screen === 'products' || screen === 'dashboard';
      const compareProfiles = compareIds.map(id => savedProfiles.find(p => p.id === id)).filter(Boolean);

      return (
        <div className="browser-chrome">
          <div className="browser-bar">
            <div className="browser-dots">
              <div className="browser-dot" />
              <div className="browser-dot" />
              <div className="browser-dot" />
            </div>
            <div className="browser-url">
              arket.com/en-gb/womens/new-arrivals{inOverlayMode ? ' · ✦ Eslucent Active' : ''}
            </div>
          </div>

          <div className="browser-body">
            <div className={`store-page${inOverlayMode ? '' : ' store-page--bg'}`}>
              {screen === 'products' && (
                <StoreOverlay
                  profile={storeProfile}
                  onEditProfile={() => setScreen('welcome')}
                  onViewDashboard={() => setScreen('dashboard')}
                />
              )}
              {screen === 'dashboard' && (
                <BrandDashboard onBack={() => setScreen('products')} />
              )}
              {!inOverlayMode && <StorePlaceholderBg />}
            </div>

            {!inOverlayMode && (
              <div className="onboarding-backdrop">
                <div className="onboarding-panel">
                  {screen === 'welcome' && (
                    <WelcomeScreen
                      onStart={handleWelcomeStart}
                      activeProfile={activeProfile}
                      profiles={savedProfiles}
                      onMyProfiles={() => setScreen('profiles')}
                    />
                  )}
                  {screen === 'scan' && (
                    <ScanScreen onComplete={handleScanComplete} existingFitProfile={fitProfile} />
                  )}
                  {screen === 'quiz' && (
                    <QuizScreen onComplete={handleQuizComplete} colorProfile={colorProfile} />
                  )}
                  {screen === 'profile' && currentProfile && (
                    <ProfileCard
                      profile={currentProfile}
                      onContinue={() => setScreen('products')}
                      onSave={handleSaveProfile}
                      onRetake={() => setScreen('scan')}
                    />
                  )}
                  {screen === 'profiles' && (
                    <ProfilesScreen
                      profiles={savedProfiles}
                      activeProfileId={activeIdState}
                      onLoad={handleLoadProfile}
                      onDelete={handleDeleteProfile}
                      onCompare={handleCompare}
                      onBack={() => setScreen('welcome')}
                    />
                  )}
                  {screen === 'compare' && compareProfiles.length === 2 && (
                    <CompareScreen
                      profiles={compareProfiles}
                      onBack={() => setScreen('profiles')}
                    />
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
